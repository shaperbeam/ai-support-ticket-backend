<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .badge-critical { background-color: #dc3545; color: white; }
        .badge-high { background-color: #fd7e14; color: white; }
        .badge-medium { background-color: #ffc107; color: black; }
        .badge-low { background-color: #198754; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Acme Support Admin</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="http://127.0.0.1:8080">Back to Store</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid mt-4 px-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Ticket Inbox</h2>
        <button class="btn btn-outline-primary" onclick="loadTickets()">Refresh Inbox</button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Customer Message</th>
                        <th>Category</th>
                        <th>Routed Dept</th>
                        <th>AI Priority</th>
                        <th>AI Confidence</th>
                        <th>AI Reasoning</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="ticketTableBody">
                    <tr><td colspan="8" class="text-center py-4">Loading tickets...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
function getPriorityBadge(priority) {
    const p = priority ? priority.toLowerCase() : '';
    if (p === 'critical') return `<span class="badge badge-critical">Critical</span>`;
    if (p === 'high') return `<span class="badge badge-high">High</span>`;
    if (p === 'medium') return `<span class="badge badge-medium">Medium</span>`;
    if (p === 'low') return `<span class="badge badge-low">Low</span>`;
    return `<span class="badge bg-secondary">${priority}</span>`;
}

async function loadTickets() {
    const tbody = document.getElementById('ticketTableBody');
    try {
        const res = await fetch('/api/tickets');
        const tickets = await res.json();
        
        tbody.innerHTML = '';
        if (tickets.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="text-center">No tickets found.</td></tr>`;
            return;
        }

        tickets.forEach(t => {
            tbody.innerHTML += `
                <tr>
                    <td>#${t.id}</td>
                    <td style="max-width: 300px;">${t.customer_message}</td>
                    <td><span class="badge bg-info text-dark">${t.primary_category}</span></td>
                    <td><strong>${t.department}</strong></td>
                    <td>${getPriorityBadge(t.priority)}</td>
                    <td>${t.confidence_score}%</td>
                    <td style="max-width: 250px; font-size: 0.85em; color: #555;">${t.reasoning}</td>
                    <td>${t.status}</td>
                </tr>
            `;
        });
    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger">Error loading tickets.</td></tr>`;
    }
}

// Initial load
loadTickets();
</script>
</body>
</html>
